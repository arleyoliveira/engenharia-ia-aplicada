<div class="app-layout">
  <!-- Barra de Topo no Mobile com Botão Hambúrguer -->
  <header class="mobile-topbar" aria-label="Cabeçalho mobile">
    <div class="mobile-brand">
      <div class="brand-badge">PIX</div>
      <span class="brand-title">Pix App</span>
    </div>

    <button
      type="button"
      class="hamburger-btn"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="app-sidebar"
      aria-label="Abrir ou fechar menu de navegação"
    >
      <span class="material-symbols-outlined hamburger-icon" aria-hidden="true">
        @if (isMenuOpen()) {
          close
        } @else {
          menu
        }
      </span>
    </button>
  </header>

  <!-- Fundo escurecido (Backdrop) no Mobile quando o menu estiver aberto -->
  @if (isMenuOpen()) {
    <div
      class="sidebar-backdrop"
      (click)="closeMenu()"
      aria-hidden="true"
    ></div>
  }

  <!-- Menu Lateral Colapsável no Mobile -->
  <aside
    id="app-sidebar"
    class="sidebar"
    [class.open]="isMenuOpen()"
    [attr.aria-hidden]="!isMenuOpen()"
  >
    <div class="brand desktop-only">
      <div class="brand-badge">PIX</div>
      <h1 class="brand-title">Pix App</h1>
    </div>

    <nav class="navigation" aria-label="Navegação principal">
      <ul class="nav-list">
        <li class="nav-item">
          <a
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
            (click)="closeMenu()"
          >
            <span class="nav-icon" aria-hidden="true">❖</span>
            <span class="nav-label">Transferência Pix</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            routerLink="/extrato"
            routerLinkActive="active"
            class="nav-link"
            (click)="closeMenu()"
          >
            <span class="nav-icon material-symbols-outlined" aria-hidden="true" style="font-size: 18px;">receipt_long</span>
            <span class="nav-label">Extrato Pix</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="theme-switcher">
      <span class="theme-title">Tema de Cores</span>
      <div class="theme-btn-group" role="group" aria-label="Escolha entre tema claro ou escuro">
        <button
          type="button"
          class="theme-btn"
          [class.active]="currentTheme() === 'light'"
          (click)="setTheme('light')"
          aria-label="Selecionar tema claro"
        >
          <span class="theme-icon" aria-hidden="true">☀️</span>
          <span>Claro</span>
        </button>
        <button
          type="button"
          class="theme-btn"
          [class.active]="currentTheme() === 'dark'"
          (click)="setTheme('dark')"
          aria-label="Selecionar tema escuro"
        >
          <span class="theme-icon" aria-hidden="true">🌙</span>
          <span>Escuro</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
